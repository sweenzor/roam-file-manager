# Temporary probe: how files work in a local graph of Roam's desktop app. See test/real-roam/local-probe.mjs.
# Commits what it found to probe-out/ on the branch.
name: Local probe

on:
  push:
    paths:
      - test/real-roam/local-probe.mjs
      - .github/workflows/local-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-roam
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAM_VERSION: 0.0.42
      ROAM_DEB_SHA512: x9Ln56V7TlDO6zDcXK0AKDeAmz5LSX1oWpKbV6w7CUzbMc/LESJ7qLQs0Ap/nPpwPCf7jUypd0LS05SsJbD/HA==
      OUT: ${{ github.workspace }}/probe-out
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the extension
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Cache the Roam installer
        uses: actions/cache@v4
        with:
          path: ~/roam-deb
          key: roam-deb-${{ env.ROAM_VERSION }}

      - name: Install Roam, Xvfb and Playwright
        run: |
          mkdir -p ~/roam-deb
          deb=~/roam-deb/roam-research_${ROAM_VERSION}_amd64.deb
          [ -f "$deb" ] || curl -fsSL -o "$deb" "https://roam-electron-deploy.s3.us-east-2.amazonaws.com/roam-research_${ROAM_VERSION}_amd64.deb"
          echo "$(echo "$ROAM_DEB_SHA512" | base64 -d | od -An -v -tx1 | tr -d ' \n')  $deb" | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$deb" xvfb tesseract-ocr
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0

      - name: Desktop app
        continue-on-error: true
        timeout-minutes: 9
        env:
          ROAM_EMAIL: ${{ secrets.ROAM_EMAIL }}
          ROAM_PASSWORD: ${{ secrets.ROAM_PASSWORD }}
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node test/real-roam/local-probe.mjs

      - name: Summary
        if: always()
        run: cat "$OUT"/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit what was found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # no picture with an email address on it is ever committed
          for f in probe-out/*.png; do
            [ -f "$f" ] || continue
            if tesseract "$f" - 2>/dev/null | grep -q '@'; then echo "dropped $f: it shows an @"; rm "$f"; fi
          done
          for f in probe-out/*; do grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' "$f" 2>/dev/null && { echo "dropped $f: it holds an email address"; rm "$f"; }; done
          git add -f probe-out
          git diff --cached --quiet && exit 0
          git commit -m "Local probe: results"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
